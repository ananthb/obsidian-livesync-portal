# SPDX-License-Identifier: AGPL-3.0-only
name: release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  release:
    if: vars.PUBLIC_RELEASE_APPROVED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      GOTOOLCHAIN: go1.27.4
      GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify legal source evidence before building
        run: |
          mkdir -p /tmp/opencode
          python3 scripts/license-provenance.py
      - name: Guard immutable tag and existing release
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/release-common.sh guard
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
      - name: Destination metadata
        shell: bash
        run: |
          {
            echo "RELEASE_OWNER=${GITHUB_REPOSITORY_OWNER}"
            echo "RELEASE_REPO=${GITHUB_REPOSITORY#*/}"
            echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_ENV"
      - run: bash scripts/test-interop.sh
      - run: go test -race ./... && go vet ./...
        env:
          SETUP_INTEROP_REQUIRED: '1'
      - run: docker compose -f examples/compose.yaml config --quiet
        env:
          PORTAL_HOST: portal.example.test
          OIDC_HOST: id.example.test
          COUCH_HOST: couch.example.test
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      - run: bash scripts/artifact-smoke.sh
        env:
          SETUP_INTEROP_REQUIRED: '1'
      - name: Inspect static binaries for both architectures
        run: bash scripts/check-static.sh dist/portal_linux_amd64_v1/livesync-portal dist/portal_linux_arm64_v8.0/livesync-portal
      - run: bash scripts/package-source.sh
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - name: Build candidates once, smoke immutable digests, then sign
        run: bash scripts/release-images.sh
      - name: Upload verified draft, promote exact manifest, finalize last
        run: bash scripts/release-finalize.sh
