# SPDX-License-Identifier: AGPL-3.0-only
name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
      - name: Exercise the embedded UI in real Chromium with dummy fixtures
        run: |
          mkdir -p /tmp/opencode
          npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts --no-package-lock playwright-core@1.64.1
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright-core"
          node "$PLAYWRIGHT_MODULE/cli.js" install --with-deps chromium
          export CHROMIUM="$(node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')"
          PORTAL_BROWSER=1 go test -race -count=1 -run '^TestBrowser' -v .
  test:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: go1.27.4
      PORTAL_DIST: dist
      IMAGE: ghcr.io/ananthb/obsidian-livesync-portal
      IMAGE_TAG: snapshot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p /tmp/opencode
      - run: python3 -B scripts/test-license-provenance.py
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - run: bash scripts/test-interop.sh
      - run: go test -race ./... && go vet ./...
        env:
          SETUP_INTEROP_REQUIRED: '1'
      # Exercise the release packaging -> install-only -> shell sequence without publishing.
      - name: Package snapshot with the pinned GoReleaser action (no publication)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean --skip=publish,ko,sign,sbom
      - name: Expose pinned GoReleaser to subsequent shells
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          install-only: true
      - name: Install pinned image inspection tool
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Verify packaged GoReleaser is available to image shell
        run: bash scripts/check-goreleaser.sh
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Build with GoReleaser-ko, execute both architectures and audit exact images (no publication)
        run: bash scripts/validate-images.sh
        env:
          SETUP_INTEROP_REQUIRED: '1'
      - run: docker compose -f examples/compose.yaml config --quiet
        env:
          PORTAL_HOST: portal.example.test
          OIDC_HOST: id.example.test
          COUCH_HOST: couch.example.test
