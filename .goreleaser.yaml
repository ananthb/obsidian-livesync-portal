# SPDX-License-Identifier: AGPL-3.0-only
version: 2
project_name: obsidian-livesync-portal
builds:
  - id: portal
    binary: livesync-portal
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, '-tags=netgo,osusergo']
    ldflags: ['-s -w -X main.sourceVersion={{ .Version }} -X main.sourceRevision={{ .FullCommit }}']
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - src: LICENSE
        info: {mode: 0644}
      - src: README.md
        info: {mode: 0644}
      - src: THIRD_PARTY_NOTICES.md
        info: {mode: 0644}
      - src: licenses/**
        info: {mode: 0644}
      - src: examples/**
        info: {mode: 0644}
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
release:
  github:
    owner: '{{ .Env.RELEASE_OWNER }}'
    name: '{{ .Env.RELEASE_REPO }}'
changelog:
  disable: true
